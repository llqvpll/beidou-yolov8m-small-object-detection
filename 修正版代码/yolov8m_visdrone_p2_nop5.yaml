# =============================================================================
# v3 · 剪枝 P5 版（3 尺度 P2/P3/P4）
# =============================================================================
# 思路来源：DRS-YOLO（Meas. Sci. Technol. 36 095413, 2025）
#   "增加高分辨率检测分支，同时剪枝低分辨率分支"
#   —— VisDrone 里几乎没有大目标，stride=32 的 P5 分支基本是浪费；
#      砍掉它可抵消 P2 带来的部分延迟开销。
#
# 相对 v1（yolov8m_visdrone_improved.yaml）的唯一变量：
#   删除原 node 27 / 28 / 29（P5 尺度的下采样 + Concat + C2f）
#   Detect 输入由 [20, 23, 26, 29] 改为 [20, 23, 26]
# 其余（DySample / EMAAttention / DualConv）完全一致，便于做消融。
#
# 注意：backbone 的 P5 阶段（Conv/C2f/SPPF）仍保留，作为 Neck 自顶向下的语义起点，
#       只剪掉"检测头分支"。若要连 backbone P5 一起剪，需要重排 Neck 起点，风险较大。
# =============================================================================

nc: 10
scale: m
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1  P2/4
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3  P3/8
  - [-1, 6, C2f, [256, True]]        # 4
  - [-1, 1, Conv, [512, 3, 2]]       # 5  P4/16
  - [-1, 6, C2f, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]      # 7  P5/32
  - [-1, 3, C2f, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9

head:
  - [-1, 1, DySample, [1024]]        # 10 P5 -> P4
  - [[-1, 6], 1, Concat, [1]]        # 11
  - [-1, 3, C2f, [512]]              # 12
  - [-1, 1, EMAAttention, [512, 32]]# 13

  - [-1, 1, DySample, [512]]         # 14 -> P3
  - [[-1, 4], 1, Concat, [1]]        # 15
  - [-1, 3, C2f, [256]]              # 16
  - [-1, 1, EMAAttention, [256, 32]]# 17

  - [-1, 1, DySample, [256]]         # 18 -> P2
  - [[-1, 2], 1, Concat, [1]]        # 19
  - [-1, 3, C2f, [128]]              # 20  P2/4  -> Detect

  - [-1, 1, DualConv, [128, 3, 2]]   # 21 -> P3
  - [[-1, 16], 1, Concat, [1]]       # 22
  - [-1, 3, C2f, [256]]              # 23  P3/8  -> Detect

  - [-1, 1, DualConv, [256, 3, 2]]   # 24 -> P4
  - [[-1, 12], 1, Concat, [1]]       # 25
  - [-1, 3, C2f, [512]]              # 26  P4/16 -> Detect

  - [[20, 23, 26], 1, Detect, [nc]]  # 27  三尺度检测头（P5 已剪枝）
