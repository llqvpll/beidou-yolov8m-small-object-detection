# =============================================================================
# v4 · Slim-Neck + 剪枝 P5（3 尺度 P2/P3/P4）—— 推荐主方案
# =============================================================================
# 同时叠加两个变量：
#   (1) Slim-Neck：Neck 的 C2f -> VoVGSCSP，下采样 DualConv -> GSConv   （轻量化）
#   (2) 剪枝 P5  ：去掉 stride=32 的检测分支，只检 P2/P3/P4             （抵消 P2 延迟）
#
# 动机：v1 的痛点有两个 —— Neck 偏重、P2 分支拖慢推理。
#       这个版本一次处理掉：Neck 变轻，同时砍掉 VisDrone 上基本没用的 P5 分支。
#
# 依赖：先运行 install_custom_modules.py（注册 EMAAttention / DySample / DualConv / GSConv / VoVGSCSP）
# =============================================================================

nc: 10
scale: m
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1  P2/4
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3  P3/8
  - [-1, 6, C2f, [256, True]]        # 4
  - [-1, 1, Conv, [512, 3, 2]]       # 5  P4/16
  - [-1, 6, C2f, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]      # 7  P5/32
  - [-1, 3, C2f, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9

head:
  - [-1, 1, DySample, [1024]]        # 10 P5 -> P4
  - [[-1, 6], 1, Concat, [1]]        # 11
  - [-1, 3, VoVGSCSP, [512]]         # 12
  - [-1, 1, EMAAttention, [512, 32]]# 13

  - [-1, 1, DySample, [512]]         # 14 -> P3
  - [[-1, 4], 1, Concat, [1]]        # 15
  - [-1, 3, VoVGSCSP, [256]]         # 16
  - [-1, 1, EMAAttention, [256, 32]]# 17

  - [-1, 1, DySample, [256]]         # 18 -> P2
  - [[-1, 2], 1, Concat, [1]]        # 19
  - [-1, 3, VoVGSCSP, [128]]         # 20  P2/4  -> Detect

  - [-1, 1, GSConv, [128, 3, 2]]     # 21 -> P3
  - [[-1, 16], 1, Concat, [1]]       # 22
  - [-1, 3, VoVGSCSP, [256]]         # 23  P3/8  -> Detect

  - [-1, 1, GSConv, [256, 3, 2]]     # 24 -> P4
  - [[-1, 12], 1, Concat, [1]]       # 25
  - [-1, 3, VoVGSCSP, [512]]         # 26  P4/16 -> Detect

  - [[20, 23, 26], 1, Detect, [nc]]  # 27  三尺度（P5 已剪枝）
