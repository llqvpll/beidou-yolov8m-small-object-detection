# =============================================================================
# v2 · Slim-Neck 版（4 尺度 P2/P3/P4/P5）
# =============================================================================
# 相对 v1（yolov8m_visdrone_improved.yaml）的唯一变量：
#   Neck 中的 C2f        -> VoVGSCSP   （GSConv 瓶颈，轻量替代）
#   下采样 DualConv      -> GSConv
# 其余（DySample / EMAAttention / P2 分支 / 检测头）完全一致，便于做消融。
#
# 归因：Slim-neck by GSConv（论文，官方实现 AlanLi1997/slim-neck-by-gsconv）
# 依赖：需先运行 install_custom_modules.py（会一并注册 GSConv / VoVGSCSP）
# 文件名必须含 "yolov8m" —— 尺度由文件名推断（yaml 里的 scale 会被覆盖）
# =============================================================================

nc: 10          # VisDrone2019-DET
scale: m
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1  P2/4
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3  P3/8
  - [-1, 6, C2f, [256, True]]        # 4
  - [-1, 1, Conv, [512, 3, 2]]       # 5  P4/16
  - [-1, 6, C2f, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]      # 7  P5/32
  - [-1, 3, C2f, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9

head:
  - [-1, 1, DySample, [1024]]        # 10 P5 -> P4
  - [[-1, 6], 1, Concat, [1]]        # 11
  - [-1, 3, VoVGSCSP, [512]]         # 12 ← 原 C2f
  - [-1, 1, EMAAttention, [512, 32]]# 13

  - [-1, 1, DySample, [512]]         # 14 -> P3
  - [[-1, 4], 1, Concat, [1]]        # 15
  - [-1, 3, VoVGSCSP, [256]]         # 16 ← 原 C2f
  - [-1, 1, EMAAttention, [256, 32]]# 17

  - [-1, 1, DySample, [256]]         # 18 -> P2
  - [[-1, 2], 1, Concat, [1]]        # 19
  - [-1, 3, VoVGSCSP, [128]]         # 20 ← 原 C2f（P2/4 检测）

  - [-1, 1, GSConv, [128, 3, 2]]     # 21 ← 原 DualConv
  - [[-1, 16], 1, Concat, [1]]       # 22
  - [-1, 3, VoVGSCSP, [256]]         # 23 ← 原 C2f（P3/8 检测）

  - [-1, 1, GSConv, [256, 3, 2]]     # 24 ← 原 DualConv
  - [[-1, 12], 1, Concat, [1]]       # 25
  - [-1, 3, VoVGSCSP, [512]]         # 26 ← 原 C2f（P4/16 检测）

  - [-1, 1, GSConv, [512, 3, 2]]     # 27 ← 原 DualConv
  - [[-1, 9], 1, Concat, [1]]        # 28
  - [-1, 3, VoVGSCSP, [1024]]        # 29 ← 原 C2f（P5/32 检测）

  - [[20, 23, 26, 29], 1, Detect, [nc]]   # 30
